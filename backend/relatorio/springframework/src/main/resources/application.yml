spring:
  application:
    name: relatorio
  datasource:
    url: jdbc:h2:file:~/relatorio-db/db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}

event:
  venda:
    queue: venda-events-relatorio
    routing-key: venda-events
    exchange: venda-exchange
  produto:
    queue: produto-events-relatorio
    routing-key: produto-events
    exchange: produto-exchange

service:
  gestao:
    url: http://localhost:8082
  login:
    url: http://localhost:8081

server:
  port: 8084

