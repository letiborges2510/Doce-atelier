server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: login-service
              uri: http://localhost:8081
              predicates:
                - Path=/fatec/login/**
            - id: gestao-service
              uri: http://localhost:8082
              predicates:
                - Path=/fatec/gestao/**
            - id: venda-service
              uri: http://localhost:8083
              predicates:
                - Path=/fatec/venda/**
            - id: relatorio-service
              uri: http://localhost:8084
              predicates:
                - Path=/fatec/relatorio/**
